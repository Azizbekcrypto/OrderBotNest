name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  smoke:
    # faqat test job'i yashil bo'lsa yuradi
    needs: test
    runs-on: ubuntu-latest
    services:
      # vaqtinchalik PostgreSQL: job tugashi bilan o'chadi
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        # pg_isready "tayyor" demaguncha qadamlar boshlanmaydi
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Smoke (Telegram'siz)
        run: npm run smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop
