name: CI

# Har push'da (istalgan branch) va main'ga ochilgan pull request'da ishlaydi.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: install → typecheck → test → build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Qadamlar ketma-ket yuradi: biri qizil bo'lsa, keyingilari yurmaydi.
    steps:
      - name: Kodni olish
        uses: actions/checkout@v7

      - name: Node 24.18.0 (lokal mashinadagi bilan bir xil, npm 11.16.0)
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm

      - name: 1. Kutubxonalar — package-lock.json bo'yicha aynan (npm ci)
        run: npm ci

      - name: 2. TypeScript tur tekshiruvi (tsc --noEmit)
        run: npx tsc --noEmit

      - name: 3. Testlar (jest)
        run: npm test -- --ci

      - name: 4. Build (nest build)
        run: npm run build
