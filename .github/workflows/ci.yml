name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish (mashinadagi versiya)
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Kutubxonalar (package-lock.json bo'yicha aynan)
        run: npm ci

      - name: TypeScript tur tekshiruvi
        run: npm run lint

      - name: Testlar
        run: npm test

      - name: Build
        run: npm run build
