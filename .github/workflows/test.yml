name: Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Node.js 22 o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Kutubxonalarni o'rnatish
        run: npm ci

      - name: Testlar
        run: npm test
